<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Amigo Secreto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- GoatCounter: conta só "/" e "/novo". Os links secretos (/r/ e /g/) nunca são enviados. -->
    <script>window.goatcounter = { no_onload: true };</script>
    <script data-goatcounter="https://amigosecreto.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script>
      window.addEventListener("load", function () {
        var p = location.pathname;
        if ((p === "/" || p === "/novo") && window.goatcounter && window.goatcounter.count) {
          window.goatcounter.count({ path: p });
        }
      });
    </script>
  </body>
</html>
